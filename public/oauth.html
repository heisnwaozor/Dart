<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in: Google Accounts</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234285F4' d='M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z'/%3E%3Cpath fill='%2334A853' d='M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z'/%3E%3Cpath fill='%23FBBC05' d='M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z'/%3E%3Cpath fill='%23EA4335' d='M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z'/%3E%3C/svg%3E" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    body {
      background: #131314;
      color: #e3e3e3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: #1e1f20;
      border: 1px solid #333538;
      border-radius: 28px;
      padding: 36px 32px 32px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #4285F4 25%, #EA4335 50%, #FBBC05 75%, #34A853 100%);
      background-size: 200% 100%;
      animation: progressMove 1.2s linear infinite;
    }
    @keyframes progressMove {
      0% { background-position: 200% 0; }
      100% { background-position: 0% 0; }
    }
    .google-logo {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px auto;
      display: block;
    }
    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 14px;
      color: #c4c7c5;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #4285F4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-action {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      border-radius: 12px;
      background: #a8c7fa;
      color: #041e49;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
      margin-top: 14px;
    }
    .btn-action:hover {
      background: #d3e3fd;
    }
    .error-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(234, 67, 53, 0.15);
      border: 1px solid rgba(234, 67, 53, 0.35);
      color: #f28b82;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
    }
    .bottom-bar {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      font-size: 11px;
      color: #8e918f;
      padding: 0 8px;
    }
    .bottom-bar a {
      color: #8e918f;
      text-decoration: none;
      margin-left: 14px;
    }
    .bottom-bar a:hover {
      color: #e3e3e3;
    }
  </style>
</head>
<body>

  <div class="auth-card" id="card">
    <div class="progress-bar" id="progressBar"></div>

    <svg class="google-logo" id="logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
    </svg>

    <h1 id="titleText">Connecting to Google</h1>
    <p class="subtitle" id="subtitleText">Opening your browser Google account chooser...</p>

    <div class="spinner" id="spinner"></div>
    <div id="actionArea"></div>
  </div>

  <div class="bottom-bar">
    <span>English (United States)</span>
    <div>
      <a href="#">Help</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </div>
  </div>

  <script>
    const CLIENT_ID = '892650901835-atcmdam7hmktaps9d52kfreij87ghu0p.apps.googleusercontent.com';
    const searchParams = new URLSearchParams(window.location.search);
    const hash = window.location.hash.substring(1);

    function generateStellarAddress() {
      const chars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let addr = 'G';
      for (let i = 0; i < 55; i++) {
        addr += chars[Math.floor(Math.random() * chars.length)];
      }
      return addr;
    }

    function completeAuth(name, email, avatar, googleSub) {
      document.getElementById('titleText').innerText = 'Signed in successfully';
      document.getElementById('subtitleText').innerText = 'Welcome ' + name + ' (' + email + ')! Syncing account...';
      document.getElementById('spinner').style.display = 'none';

      const payload = {
        type: 'POLLAR_OAUTH_SUCCESS',
        provider: 'google',
        name: name,
        email: email,
        avatar: avatar || ('https://api.dicebear.com/7.x/identicon/svg?seed=' + encodeURIComponent(email)),
        walletAddress: generateStellarAddress(),
        googleSub: googleSub || ''
      };

      try {
        localStorage.setItem('pollar_oauth_success', JSON.stringify(payload));
      } catch (e) {}

      setTimeout(() => {
        if (window.opener) {
          try {
            window.opener.postMessage(payload, '*');
          } catch (e) {}
          setTimeout(() => {
            window.close();
          }, 350);
        } else {
          document.getElementById('actionArea').innerHTML = `
            <p style="font-size: 13px; color: #a8c7fa; margin-bottom: 12px;">Authentication complete. You can close this window and return to Dart.</p>
            <button class="btn-action" onclick="window.close()">Close Window</button>
          `;
        }
      }, 500);
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
          .join('')
      );
      return JSON.parse(jsonPayload);
    }

    if (hash) {
      const hashParams = new URLSearchParams(hash);
      const idToken = hashParams.get('id_token');
      const accessToken = hashParams.get('access_token');
      const error = hashParams.get('error');

      if (error) {
        document.getElementById('titleText').innerText = 'Google Authentication Notice';
        document.getElementById('subtitleText').innerText = 'Google reported: ' + error;
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('actionArea').innerHTML = `
          <div class="error-box">Google authentication was cancelled or returned an error: ${error}</div>
          <button class="btn-action" onclick="startGoogleOAuth()">Try Again</button>
        `;
      } else if (idToken) {
        try {
          const data = parseJwt(idToken);
          const name = data.name || data.given_name || (data.email ? data.email.split('@')[0] : 'Google User');
          const email = data.email || 'user@gmail.com';
          const avatar = data.picture || ('https://api.dicebear.com/7.x/identicon/svg?seed=' + encodeURIComponent(email));
          completeAuth(name, email, avatar, data.sub);
        } catch (e) {
          console.error(e);
          if (accessToken) {
            fetchGoogleUserInfo(accessToken);
          }
        }
      } else if (accessToken) {
        fetchGoogleUserInfo(accessToken);
      }
    } else {
      const provider = searchParams.get('provider') || 'google';

      if (provider === 'google') {
        startGoogleOAuth();
      } else if (provider === 'github') {
        handleGithub();
      }
    }

    function startGoogleOAuth() {
      const redirectUri = window.location.origin + '/oauth.html';
      const clientId = searchParams.get('client_id') || CLIENT_ID;

      const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
        'client_id=' + encodeURIComponent(clientId) +
        '&redirect_uri=' + encodeURIComponent(redirectUri) +
        '&response_type=' + encodeURIComponent('token id_token') +
        '&scope=' + encodeURIComponent('openid email profile') +
        '&prompt=select_account' +
        '&nonce=' + Date.now();

      window.location.href = authUrl;
    }

    function fetchGoogleUserInfo(token) {
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: 'Bearer ' + token }
      })
        .then(r => r.json())
        .then(data => {
          const name = data.name || data.email.split('@')[0];
          completeAuth(name, data.email, data.picture, data.sub);
        })
        .catch(err => {
          document.getElementById('titleText').innerText = 'Error Loading Profile';
          document.getElementById('subtitleText').innerText = err.message;
          document.getElementById('spinner').style.display = 'none';
        });
    }

    function handleGithub() {
      document.getElementById('logo').outerHTML = `
        <svg class="google-logo" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      `;
      document.getElementById('titleText').innerText = 'GitHub Authentication';
      document.getElementById('subtitleText').innerText = 'Sign in with your GitHub username';
      document.getElementById('spinner').style.display = 'none';

      document.getElementById('actionArea').innerHTML = `
        <div style="text-align: left; margin-top: 10px;">
          <label style="font-size: 11px; font-weight: 600; color: #c4c7c5;">GitHub Username</label>
          <input type="text" id="ghHandle" value="heisnwaozor" style="width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #444746; background: #131314; color: #ffffff; font-size: 13px; margin-top: 6px; margin-bottom: 12px; outline: none;">
          <button class="btn-action" onclick="submitGithub()">Continue with GitHub</button>
        </div>
      `;

      window.submitGithub = function() {
        const handle = document.getElementById('ghHandle').value.trim() || 'heisnwaozor';
        completeAuth(handle, handle + '@users.noreply.github.com', 'https://github.com/' + handle + '.png', handle);
      };
    }
  </script>
</body>
</html>
