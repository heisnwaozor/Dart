<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google - Dart</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M58 48 L22 22 C16 38, 20 54, 38 62 L56 54 Z' fill='%232563EB' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3Cpath d='M62 48 L98 22 C104 38, 100 54, 82 62 L64 54 Z' fill='%2360A5FA' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3C/svg%3E" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0b101b;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #141c2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #05c92f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .error-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 12px;
      text-align: left;
    }
    .guide-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
      font-size: 12px;
      color: #cbd5e1;
    }
    .guide-box code {
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
      color: #38bdf8;
      word-break: break-all;
    }
    .btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-green {
      background: #05c92f;
      color: #070a13;
    }
    .btn-green:hover {
      background: #04b82a;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      font-size: 12px;
      outline: none;
      margin-top: 8px;
    }
    input:focus {
      border-color: #05c92f;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Connecting to Google...</h1>
    <p id="desc">Opening Google Account selection screen.</p>
    <div id="dynamicArea"></div>
  </div>

  <script>
    function generateStellarAddress() {
      const chars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let addr = 'G';
      for (let i = 0; i < 55; i++) {
        addr += chars[Math.floor(Math.random() * chars.length)];
      }
      return addr;
    }

    function notifyOpenerAndClose(payload) {
      document.getElementById('spinner').style.borderTopColor = '#05c92f';
      document.getElementById('title').innerText = 'Connected as ' + (payload.name || payload.email);
      document.getElementById('desc').innerText = 'Registering your Stellar wallet in database...';

      if (window.opener) {
        window.opener.postMessage(payload, '*');
        setTimeout(() => {
          window.close();
        }, 700);
      } else {
        localStorage.setItem('pollar_oauth_success', JSON.stringify(payload));
        document.getElementById('desc').innerText = 'Success! You can now close this tab and return to Dart.';
      }
    }

    // 1. Check if returning from Google OAuth redirect (URL Fragment Hash)
    const hash = window.location.hash.substring(1);
    const searchParams = new URLSearchParams(window.location.search);

    if (hash) {
      const hashParams = new URLSearchParams(hash);
      const idToken = hashParams.get('id_token');
      const accessToken = hashParams.get('access_token');
      const error = hashParams.get('error');

      if (error) {
        showError('Google Authorization Error: ' + error);
      } else if (idToken) {
        try {
          const base64Url = idToken.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          const jsonPayload = decodeURIComponent(
            atob(base64)
              .split('')
              .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
              .join('')
          );
          const data = JSON.parse(jsonPayload);
          notifyOpenerAndClose({
            type: 'POLLAR_OAUTH_SUCCESS',
            provider: 'google',
            name: data.name || data.given_name || data.email.split('@')[0],
            email: data.email,
            avatar: data.picture || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(data.email)}`,
            walletAddress: generateStellarAddress()
          });
        } catch (e) {
          showError('Failed to parse Google ID token: ' + e.message);
        }
      } else if (accessToken) {
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: `Bearer ${accessToken}` }
        })
          .then(r => r.json())
          .then(data => {
            notifyOpenerAndClose({
              type: 'POLLAR_OAUTH_SUCCESS',
              provider: 'google',
              name: data.name || data.email.split('@')[0],
              email: data.email,
              avatar: data.picture || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(data.email)}`,
              walletAddress: generateStellarAddress()
            });
          })
          .catch(err => {
            showError('Failed to fetch Google profile: ' + err.message);
          });
      }
    } else if (searchParams.get('error')) {
      showError('Google OAuth Error: ' + searchParams.get('error'));
    } else {
      // 2. Initial Launch: Redirect to Google's official authorization endpoint
      const provider = searchParams.get('provider') || 'google';

      if (provider === 'google') {
        const storedClientId = localStorage.getItem('pollar_google_client_id');
        const defaultClientId = '1067577884102-p5j7c65k0c3t245qj96k8fbl4v36q0i4.apps.googleusercontent.com';
        const clientId = searchParams.get('client_id') || storedClientId || defaultClientId;

        const redirectUri = window.location.origin + '/oauth.html';
        const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
          'client_id=' + encodeURIComponent(clientId) +
          '&redirect_uri=' + encodeURIComponent(redirectUri) +
          '&response_type=' + encodeURIComponent('token id_token') +
          '&scope=' + encodeURIComponent('openid email profile') +
          '&prompt=select_account' +
          '&nonce=' + Date.now();

        // Redirect popup window to Google accounts chooser
        window.location.href = authUrl;
      } else if (provider === 'github') {
        // GitHub direct auth prompt
        document.getElementById('title').innerText = 'GitHub Authentication';
        document.getElementById('desc').innerText = 'Enter your GitHub username to sync profile';
        document.getElementById('spinner').style.display = 'none';

        const area = document.getElementById('dynamicArea');
        area.innerHTML = `
          <div style="margin-top: 16px; text-align: left;">
            <label style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">GitHub Username</label>
            <input type="text" id="ghUser" placeholder="e.g. heisnwaozor" value="heisnwaozor">
            <button onclick="handleGithub()" class="btn btn-green">Connect GitHub Account</button>
          </div>
        `;

        window.handleGithub = function() {
          const user = document.getElementById('ghUser').value.trim() || 'heisnwaozor';
          fetch('https://api.github.com/users/' + encodeURIComponent(user))
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              const name = data?.name || user;
              const avatar = data?.avatar_url || `https://github.com/${user}.png`;
              const email = `${user}@users.noreply.github.com`;
              notifyOpenerAndClose({
                type: 'POLLAR_OAUTH_SUCCESS',
                provider: 'github',
                name: name,
                email: email,
                avatar: avatar,
                walletAddress: generateStellarAddress()
              });
            })
            .catch(() => {
              notifyOpenerAndClose({
                type: 'POLLAR_OAUTH_SUCCESS',
                provider: 'github',
                name: user,
                email: `${user}@users.noreply.github.com`,
                avatar: `https://github.com/${user}.png`,
                walletAddress: generateStellarAddress()
              });
            });
        };
      }
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').innerText = 'Google Connection Setup';
      document.getElementById('desc').innerText = 'Google requires your exact local URL to be authorized in Google Cloud Console.';

      const redirectUri = window.location.origin + '/oauth.html';
      const origin = window.location.origin;

      const area = document.getElementById('dynamicArea');
      area.innerHTML = `
        <div class="error-box">${msg}</div>
        <div class="guide-box">
          <strong>How to whitelist your local project in Google Cloud:</strong>
          <ol style="margin-left: 18px; margin-top: 8px; line-height: 1.6;">
            <li>Go to <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color: #38bdf8;">Google Cloud Console &gt; Credentials</a></li>
            <li>Select your OAuth 2.0 Web Client ID</li>
            <li>Add to <strong>Authorized JavaScript origins</strong>: <code>${origin}</code></li>
            <li>Add to <strong>Authorized redirect URIs</strong>: <code>${redirectUri}</code></li>
            <li>Click <strong>Save</strong></li>
          </ol>
        </div>

        <div style="margin-top: 16px; text-align: left;">
          <label style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Or Enter Your Custom Google Client ID:</label>
          <input type="text" id="customClientId" placeholder="e.g. 123456-abcdef.apps.googleusercontent.com">
          <button onclick="saveClientIdAndRetry()" class="btn btn-green">Save Client ID &amp; Retry Google Login</button>
        </div>

        <button onclick="window.close()" class="btn btn-secondary" style="margin-top: 8px;">Cancel &amp; Close</button>
      `;

      window.saveClientIdAndRetry = function() {
        const id = document.getElementById('customClientId').value.trim();
        if (id) {
          localStorage.setItem('pollar_google_client_id', id);
          window.location.href = window.location.origin + '/oauth.html?provider=google&client_id=' + encodeURIComponent(id);
        }
      };
    }
  </script>
</body>
</html>
